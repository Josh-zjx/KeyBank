name: CI

on:
  pull_request:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# To have failing CI block merges, configure GitHub branch protection to require
# these stable job names as status checks.
jobs:
  go-test-race-cover:
    name: go-test-race-cover
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true

      - name: Run Go tests with race detector and coverage
        run: go test ./... -race -cover

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run gosec
        uses: securego/gosec@v2.25.0
        with:
          args: ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-input: "1.27.4"
          go-package: ./...

  docker-playwright-smoke:
    name: docker-playwright-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Build service containers
        run: |
          docker build --target api --tag keybank-api-ci:${{ github.sha }} .
          docker build --target demo --tag keybank-demo-ci:${{ github.sha }} .

      - name: Tag release images
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag keybank-api-ci:${{ github.sha }} keybank:${{ github.ref_name }}
          docker tag keybank-demo-ci:${{ github.sha }} keybank-demo:${{ github.ref_name }}

      - name: Start API and demo containers
        run: |
          docker run --detach --rm --name keybank-api-ci --publish 4174:14000 --env KEYBANK_STORE=mem --env CORS_ALLOWED_ORIGINS=http://127.0.0.1:4173 keybank-api-ci:${{ github.sha }}
          docker run --detach --rm --name keybank-demo-ci --publish 4173:14001 --env API_BASE_URL=http://127.0.0.1:4174/api/v1 --env AUTO_HIDE_SECONDS=1 keybank-demo-ci:${{ github.sha }}

      - name: Wait for service readiness
        run: |
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:4174/healthz >/dev/null && curl --silent --show-error --fail http://127.0.0.1:4173/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs keybank-api-ci
          docker logs keybank-demo-ci
          exit 1

      - name: Run Playwright smoke tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs keybank-api-ci
          docker logs keybank-demo-ci

      - name: Stop service containers
        if: always()
        run: docker stop keybank-api-ci keybank-demo-ci
