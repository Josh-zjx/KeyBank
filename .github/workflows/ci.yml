name: CI

on:
  pull_request:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# To have failing CI block merges, configure GitHub branch protection to require
# these stable job names as status checks.
jobs:
  go-test-race-cover:
    name: go-test-race-cover
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests with race detector and coverage
        run: go test ./... -race -cover

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run gosec
        uses: securego/gosec@v2.25.0
        with:
          args: ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: go.mod
          go-package: ./...

  docker-playwright-smoke:
    name: docker-playwright-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Build application container
        run: docker build --tag keybank-ci:${{ github.sha }} .

      - name: Tag release image
        if: startsWith(github.ref, 'refs/tags/')
        run: docker tag keybank-ci:${{ github.sha }} keybank:${{ github.ref_name }}

      - name: Start application container
        run: docker run --detach --rm --name keybank-ci --publish 4173:14000 --env PORT=14000 --env KEYBANK_STORE=mem --env AUTO_HIDE_SECONDS=1 keybank-ci:${{ github.sha }}

      - name: Wait for container readiness
        run: |
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "KeyBank container did not become ready" >&2
          docker logs keybank-ci
          exit 1

      - name: Run Playwright smoke tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e

      - name: Show container logs on failure
        if: failure()
        run: docker logs keybank-ci

      - name: Stop application container
        if: always()
        run: docker stop keybank-ci || true
