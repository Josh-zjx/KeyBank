services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "14000"
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      KEYBANK_STORE: ${KEYBANK_STORE:-redis}
      MAX_TTL: ${MAX_TTL:-168h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS-http://localhost:14001,http://127.0.0.1:14001}
    ports:
      - "127.0.0.1:${API_PORT:-14000}:14000"

  demo:
    build:
      context: .
      target: demo
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "14001"
      API_BASE_URL: ${API_BASE_URL:-http://localhost:14000/api/v1}
      MAX_TTL: ${MAX_TTL:-168h}
      AUTO_HIDE_SECONDS: ${AUTO_HIDE_SECONDS:-60}
    ports:
      - "127.0.0.1:${DEMO_PORT:-14001}:14001"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Keys are ephemeral: no disk persistence, no silent eviction of unread keys.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.9-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      demo:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
